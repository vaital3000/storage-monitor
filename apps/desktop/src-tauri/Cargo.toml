[package]
name = "storage-monitor-desktop"
version = "0.4.0"
description = "Storage Monitor desktop app"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "storage_monitor_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
storage-monitor-core = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# `tauri::test::mock_app`: the command tests call a command over the state the app
# manages. The feature adds no dependency and is off in every build but the tests.
tauri = { version = "2", features = ["test"] }
tempfile = { workspace = true }
# `TestSystem`: deletion tests run against a temporary filesystem, never the real one.
storage-monitor-core = { workspace = true, features = ["testing"] }
