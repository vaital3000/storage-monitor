[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/vaital3000/storage-monitor"
authors = ["Vitaliy Pomozov"]

[workspace.dependencies]
storage-monitor-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
postcard = { version = "1", features = ["alloc"] }
lz4_flex = "0.14"
nix = { version = "0.31", features = ["fs"] }
dirs = "7"
tempfile = "3"

# Debug builds carry the debug info of every dependency, which in a Tauri tree is
# hundreds of crates and most of `target/debug`. Keep line tables for our own
# crates so test backtraces stay readable, and drop the rest.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true
